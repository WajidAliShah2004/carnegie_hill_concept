name: Deploy

# The owner taps Publish in the Studio. Sanity fires a webhook at GitHub's
# repository_dispatch. This workflow builds, runs every gate, and deploys.
# Target is within 3 minutes of the tap.
#
# Ten quick uploads make one build: the concurrency group below cancels a run
# that is still going when the next publish arrives.
#
# Until the original photos are in Sanity a production build cannot pass, so
# everything is staging unless the repository variable PRODUCTION_READY is
# `true`. While it is not, a publish gates the `staging` branch's code (the
# code the Vercel staging hook builds), and a push to master deploys nothing.

on:
  repository_dispatch:
    types: [sanity-publish]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Which site to write over
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Print what would happen and upload nothing
        type: boolean
        default: false

# One build at a time per environment. A publish that arrives mid-build
# cancels it and starts again with the newer content, which is what the owner
# expects when he adds four photos in a row.
concurrency:
  group: deploy-${{ github.event.inputs.environment || (vars.PRODUCTION_READY == 'true' && github.ref == 'refs/heads/master' && 'production') || 'staging' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Gate and deploy
    # A push to master is a production deploy, so it waits for PRODUCTION_READY.
    if: ${{ github.event_name != 'push' || vars.PRODUCTION_READY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || (vars.PRODUCTION_READY == 'true' && github.ref == 'refs/heads/master' && 'production') || 'staging' }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.carnegiehillframing.com' }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITEKEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # Runs before the checkout, so it cannot use the default working
      # directory: site/ does not exist yet. The payload comes from outside
      # the repository, so it reaches the shell as variables, never as script.
      - name: Say what triggered this
        working-directory: .
        env:
          TRIGGER: ${{ github.event_name }}
          DOCUMENT_TYPE: ${{ github.event.client_payload.documentType }}
          DOCUMENT_ID: ${{ github.event.client_payload.documentId }}
        run: |
          echo "trigger: $TRIGGER"
          echo "environment: $DEPLOY_ENV"
          echo "target: ${DEPLOY_TARGET:-unset}"
          echo "document: ${DOCUMENT_TYPE:-none} ${DOCUMENT_ID:-}"

      - name: Check out
        uses: actions/checkout@v4
        with:
          # A publish before PRODUCTION_READY gates the code the staging host
          # builds. Empty means the default: the commit that triggered the run.
          ref: ${{ github.event_name == 'repository_dispatch' && vars.PRODUCTION_READY != 'true' && (vars.STAGING_BRANCH || 'staging') || '' }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium

      # ---- Every gate blocks the deploy -------------------------------
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Every statement has a source
        run: npm run check:sources

      - name: Build
        run: npm run build

      - name: Report the JavaScript weight
        run: npm run js-weight

      - name: Every word traces to content or labels
        run: npm run check:strings

      - name: Structured data says nothing the page does not
        run: npm run check:jsonld

      - name: Playwright, axe, links, sitemap, redirects
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npm run lh

      # ---- Keep the previous build, for rollback ----------------------
      # Hostinger has no deployment history of its own, so the artifact from
      # the last successful production deploy is the rollback.
      - name: Fetch the sitemap from the previous deploy
        id: previous
        continue-on-error: true
        run: |
          mkdir -p ../previous
          RUN_ID=$(gh run list \
            --workflow=deploy.yml \
            --branch=${{ github.ref_name }} \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name "out-$DEPLOY_ENV" --dir ../previous || true
          fi
          if [ -f ../previous/sitemap.xml ]; then
            echo "sitemap=$(cd .. && pwd)/previous/sitemap.xml" >> "$GITHUB_OUTPUT"
            echo "Previous sitemap found."
          else
            echo "No previous sitemap. IndexNow will submit every URL."
          fi

      # ---- Deploy -----------------------------------------------------
      - name: Deploy (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm run deploy:dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Load the deploy key
        if: ${{ github.event.inputs.dry_run != 'true' && vars.DEPLOY_TARGET == 'hostinger' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Keep this build for the next rollback
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.DEPLOY_ENV }}
          path: site/out
          retention-days: 30
          include-hidden-files: true

      # ---- IndexNow, last ---------------------------------------------
      # It skips itself on staging and when the key is unset, and a failure
      # here never fails the deploy: the site is already live and correct.
      - name: Tell IndexNow what changed
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: npm run indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PREVIOUS_SITEMAP: ${{ steps.previous.outputs.sitemap }}

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            site/playwright-report
            site/test-results
            site/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore
